<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#faf7f3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>나의 루틴</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#322c2b;background:#faf7f3}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;min-height:100dvh;padding:24px 18px 108px}.eyebrow{font-size:13px;color:#958482;font-weight:700}h1{font-size:30px;margin:7px 0 14px}h2{font-size:19px;margin:0}p{line-height:1.5}.muted{color:#978c88}.top{display:flex;justify-content:space-between;align-items:center}.pill{background:#f0e8e5;color:#84635a;border-radius:24px;padding:8px 12px;font-size:12px;font-weight:700}.hero{background:#eae4f8;border-radius:24px;padding:22px;margin:16px 0 24px}.hero .val{font-size:40px;font-weight:800;margin:5px 0}.bar{height:10px;background:#d6cbed;border-radius:30px;overflow:hidden}.bar>div{height:100%;background:#8670cc;width:0%;border-radius:30px;transition:.15s}.section{display:flex;align-items:center;justify-content:space-between;margin:23px 0 11px}.softbtn{border:none;border-radius:12px;padding:10px 14px;background:#eee8e4;color:#665750;font-weight:700}.primary{background:#7966ba;color:white}.item{display:flex;align-items:center;gap:12px;background:white;border-radius:16px;padding:13px;margin:9px 0;box-shadow:0 2px 12px #43342808}.check{height:31px;width:31px;border:2px solid #d6c7d4;border-radius:10px;background:white;color:white;flex-shrink:0;font-size:19px}.check.done{background:#8c76c5;border-color:#8c76c5}.itemmain{flex:1;min-width:0}.name{font-weight:750}.sub{font-size:12px;color:#9f9695;margin-top:4px}.iconbtn{border:none;background:transparent;color:#9d9290;padding:8px;font-size:17px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfbf5;backdrop-filter:blur(9px);border-top:1px solid #eee6e2;display:flex;justify-content:space-around;padding:11px 8px max(14px,env(safe-area-inset-bottom))}.nav button{border:none;background:transparent;color:#a39998;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700}.nav button.active{color:#8068c2}.nav span{font-size:21px}.empty{background:white;padding:30px 16px;border-radius:16px;text-align:center;color:#998e8c}.modalbg{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal{background:#fffdfb;border-radius:22px 22px 0 0;max-width:560px;width:100%;padding:24px 18px max(26px,env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}label{display:block;font-size:13px;color:#746864;font-weight:700;margin:16px 0 7px}input[type=text],select{width:100%;padding:14px;border:1px solid #e6dbd7;border-radius:12px;background:white;color:#302929}.days{display:flex;gap:5px}.days button{flex:1;border:1px solid #ddd1d2;background:white;border-radius:10px;padding:10px 0;color:#817575}.days button.selected{background:#8871c4;color:white;border-color:#8871c4}.actions{display:flex;gap:8px;margin-top:22px}.actions button{flex:1;padding:14px;border:none;border-radius:12px;font-weight:750}.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:white;border-radius:16px;padding:20px}.stat strong{font-size:28px;display:block;margin-top:8px}.stat small{color:#948986}.note{font-size:12px;color:#9b8d8b}.danger{color:#b45151!important}.hidden{display:none}.daystrip{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px}.daystrip button{min-width:53px;border:0;border-radius:14px;padding:11px 4px;background:white;color:#817875}.daystrip button.active{background:#8871c4;color:white}.daystrip small{display:block;font-size:10px;margin-bottom:6px}
</style></head><body><div class="app"><div id="app"></div></div><div class="nav"><button data-tab="today" class="active"><span>☑</span>오늘</button><button data-tab="all"><span>☷</span>전체 루틴</button><button data-tab="stats"><span>▥</span>통계</button><button data-tab="settings"><span>⚙</span>설정</button></div><div id="portal"></div><script>
'use strict';const KEY='personal-routine-v1';const DOW=['일','월','화','수','목','금','토'];let state={habits:[],checks:{}};try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.habits)&&s.checks&&typeof s.checks==='object')state=s}catch{}let tab='today',day=localDate(),editId=null,chosenDays=[0,1,2,3,4,5,6];function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseDate(x){let [y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d)}function addDays(x,n){let d=parseDate(x);d.setDate(d.getDate()+n);return localDate(d)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function active(h,d){return h.days.includes(parseDate(d).getDay())&&(!h.created||h.created<=d)}function checked(id,d){return !!state.checks[d]?.[id]}function list(d){return state.habits.filter(h=>active(h,d)).sort((a,b)=>(a.period||'').localeCompare(b.period||''))}function rate(d){let a=list(d);return {count:a.length,done:a.filter(h=>checked(h.id,d)).length}}function toggle(id,d){state.checks[d]??={};if(state.checks[d][id])delete state.checks[d][id];else state.checks[d][id]=true;save();render()}function item(h,d,withCheck=true){return `<div class="item">${withCheck?`<button class="check ${checked(h.id,d)?'done':''}" data-check="${esc(h.id)}" aria-label="${esc(h.name)} 완료">${checked(h.id,d)?'✓':''}</button>`:`<div style="font-size:24px">${esc(h.emoji||'✨')}</div>`}<div class="itemmain"><div class="name">${withCheck?esc(h.emoji||'✨')+' ':''}${esc(h.name)}</div><div class="sub">${esc(h.period||'언제든')} · ${h.days.length===7?'매일':h.days.map(x=>DOW[x]).join('·')}요일</div></div><button class="iconbtn" data-edit="${esc(h.id)}" aria-label="수정">✎</button></div>`}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const a=document.getElementById('app');if(tab==='today'){let r=rate(day);let dates=Array.from({length:7},(_,i)=>addDays(localDate(),i-3));a.innerHTML=`<div class="top"><div class="eyebrow">MY DAILY ROUTINE</div><div class="pill">🌷 나만의 페이스</div></div><h1>오늘도 한 걸음 🌱</h1><div class="daystrip">${dates.map(d=>`<button data-day="${d}" class="${d===day?'active':''}"><small>${DOW[parseDate(d).getDay()]}</small>${parseDate(d).getDate()}</button>`).join('')}</div><div class="hero"><div>루틴 달성률 · ${esc(day)}</div><div class="val">${r.count?Math.round(r.done/r.count*100):0}%</div><div class="bar"><div style="width:${r.count?r.done/r.count*100:0}%"></div></div><p style="margin-bottom:0">${r.done} / ${r.count}개 완료</p></div><div class="section"><h2>나의 루틴</h2><button class="softbtn primary" data-new>＋ 추가</button></div>${list(day).length?list(day).map(h=>item(h,day)).join(''):'<div class="empty">아직 등록된 루틴이 없어요.<br>첫 번째 루틴을 추가해 보세요!</div>'}`}
else if(tab==='all'){a.innerHTML=`<div class="eyebrow">ALL ROUTINES</div><h1>전체 루틴</h1><div class="section"><span class="muted">총 ${state.habits.length}개 · 개수 제한 없음</span><button class="softbtn primary" data-new>＋ 추가</button></div>${state.habits.length?state.habits.map(h=>item(h,day,false)).join(''):'<div class="empty">루틴을 자유롭게 등록해 보세요.</div>'}`}
else if(tab==='stats'){let today=localDate(),dates=Array.from({length:30},(_,i)=>addDays(today,-i)),total=dates.reduce((s,d)=>s+rate(d).count,0),done=dates.reduce((s,d)=>s+rate(d).done,0),perfect=dates.filter(d=>rate(d).count>0&&rate(d).done===rate(d).count).length;a.innerHTML=`<div class="eyebrow">MY PROGRESS</div><h1>통계</h1><p class="muted">최근 30일 기준 (등록 이전 날짜 제외)</p><div class="statsgrid"><div class="stat"><small>전체 달성률</small><strong>${total?Math.round(done/total*100):0}%</strong></div><div class="stat"><small>완벽한 날</small><strong>${perfect}일</strong></div><div class="stat"><small>완료 횟수</small><strong>${done}회</strong></div><div class="stat"><small>등록 루틴</small><strong>${state.habits.length}개</strong></div></div><div class="section"><h2>최근 7일</h2></div>${dates.slice(0,7).map(d=>{let r=rate(d);return `<div class="item" style="display:block"><div class="top"><span>${d}</span><span>${r.done}/${r.count}</span></div><div class="bar" style="margin-top:10px"><div style="width:${r.count?r.done/r.count*100:0}%"></div></div></div>`}).join('')}<p class="note">완료율은 해당 날짜에 예정된 루틴 기준입니다.</p>`}
else{a.innerHTML=`<div class="eyebrow">PREFERENCES</div><h1>설정 및 백업</h1><div class="item" style="display:block"><h2>내 데이터 보호하기</h2><p class="muted">기록은 이 기기의 앱 저장소에만 보관됩니다. 기기 변경이나 데이터 삭제 전에 백업하세요.</p><div class="actions"><button class="primary" data-export>JSON 백업</button><button class="softbtn" data-import>백업 복원</button></div><input id="file" type="file" accept="application/json,.json" class="hidden"></div><div class="item" style="display:block"><h2>사용 방법</h2><p>아이폰 Safari에서 사이트를 열고 공유 → 홈 화면에 추가 → 웹 앱으로 열기를 선택하세요.</p><p class="note">로그인 및 기기간 자동 동기화 기능은 제공하지 않습니다.</p></div><div class="item" style="display:block"><button class="softbtn danger" data-reset>전체 데이터 삭제</button></div>`}}
function modal(h){editId=h?.id||null;chosenDays=h?[...h.days]:[0,1,2,3,4,5,6];document.getElementById('portal').innerHTML=`<div class="modalbg" id="bg"><div class="modal" role="dialog" aria-modal="true" aria-label="루틴 편집"><div class="top"><h2>${h?'루틴 수정':'새 루틴 추가'}</h2><button class="iconbtn" data-close>✕</button></div><form id="habitForm"><label for="nm">루틴 이름</label><input id="nm" type="text" maxlength="70" required placeholder="예: 아침 스트레칭" value="${esc(h?.name||'')}"><label for="emoji">아이콘 (이모지)</label><input id="emoji" type="text" maxlength="8" placeholder="🌱" value="${esc(h?.emoji||'🌱')}"><label for="period">시간대</label><select id="period">${['아침','오후','저녁','언제든'].map(v=>`<option ${h?.period===v?'selected':''}>${v}</option>`).join('')}</select><label>반복 요일</label><div class="days">${DOW.map((x,i)=>`<button type="button" data-week="${i}" class="${chosenDays.includes(i)?'selected':''}">${x}</button>`).join('')}</div><div class="actions"><button class="softbtn" type="button" data-close>취소</button><button class="primary" type="submit">저장하기</button></div>${h?'<button type="button" class="softbtn danger" style="width:100%;margin-top:10px" data-delete>이 루틴 삭제</button>':''}</form></div></div>`;document.getElementById('nm').focus()}
function close(){document.getElementById('portal').innerHTML=''}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.hasAttribute('data-new'))modal();else if(b.dataset.day){day=b.dataset.day;render()}else if(b.dataset.check)toggle(b.dataset.check,day);else if(b.dataset.edit)modal(state.habits.find(h=>h.id===b.dataset.edit));else if(b.hasAttribute('data-close'))close();else if(b.dataset.week!==undefined){let i=+b.dataset.week;chosenDays=chosenDays.includes(i)?chosenDays.filter(x=>x!==i):[...chosenDays,i];document.querySelectorAll('[data-week]').forEach(btn=>btn.classList.toggle('selected',chosenDays.includes(+btn.dataset.week)))}else if(b.hasAttribute('data-delete')){if(confirm('루틴을 삭제할까요? 기존 완료 기록에서도 제외됩니다.')){state.habits=state.habits.filter(h=>h.id!==editId);Object.values(state.checks).forEach(r=>delete r[editId]);save();close();render()}}else if(b.hasAttribute('data-export')){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='my-routine-backup-'+localDate()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(b.hasAttribute('data-import'))document.getElementById('file').click();else if(b.hasAttribute('data-reset')){if(confirm('모든 루틴과 기록을 완전히 삭제하시겠어요?')){state={habits:[],checks:{}};save();render()}}});document.addEventListener('submit',e=>{if(e.target.id!=='habitForm')return;e.preventDefault();let name=document.getElementById('nm').value.trim();if(!name||!chosenDays.length){alert('이름과 반복 요일을 선택하세요.');return}let h=editId?state.habits.find(x=>x.id===editId):null;if(h){Object.assign(h,{name,emoji:document.getElementById('emoji').value.trim()||'🌱',period:document.getElementById('period').value,days:chosenDays.slice().sort()})}else state.habits.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),name,emoji:document.getElementById('emoji').value.trim()||'🌱',period:document.getElementById('period').value,days:chosenDays.slice().sort(),created:localDate()});save();close();render()});document.addEventListener('change',async e=>{if(e.target.id!=='file')return;let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.habits)||!data.checks||typeof data.checks!=='object'||data.habits.some(h=>!h.id||typeof h.name!=='string'||!Array.isArray(h.days)||h.days.some(d=>!Number.isInteger(d)||d<0||d>6)))throw Error('형식 오류');if(confirm('현재 데이터를 백업 파일의 내용으로 교체할까요?')){state={habits:data.habits.map(h=>({...h,name:h.name.slice(0,70),emoji:String(h.emoji||'🌱').slice(0,8),period:String(h.period||'언제든'),created:h.created||localDate()})),checks:data.checks};save();render();alert('복원했어요.')}}catch(err){alert('올바른 백업 파일이 아니에요.')}e.target.value=''});render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
