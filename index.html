<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#faf7f3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>나의 루틴</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#322c2b;background:#faf7f3}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;min-height:100dvh;padding:24px 18px 108px}.eyebrow{font-size:13px;color:#958482;font-weight:700}h1{font-size:30px;margin:7px 0 14px}h2{font-size:19px;margin:0}p{line-height:1.5}.muted{color:#978c88}.top{display:flex;justify-content:space-between;align-items:center}.pill{background:#f0e8e5;color:#84635a;border-radius:24px;padding:8px 12px;font-size:12px;font-weight:700}.hero{background:#eae4f8;border-radius:24px;padding:22px;margin:16px 0 24px}.hero .val{font-size:40px;font-weight:800;margin:5px 0}.bar{height:10px;background:#d6cbed;border-radius:30px;overflow:hidden}.bar>div{height:100%;background:#8670cc;width:0%;border-radius:30px;transition:.15s}.section{display:flex;align-items:center;justify-content:space-between;margin:23px 0 11px}.softbtn{border:none;border-radius:12px;padding:10px 14px;background:#eee8e4;color:#665750;font-weight:700}.primary{background:#7966ba;color:white}.item{display:flex;align-items:center;gap:12px;background:white;border-radius:16px;padding:13px;margin:9px 0;box-shadow:0 2px 12px #43342808}.check{height:31px;width:31px;border:2px solid #d6c7d4;border-radius:10px;background:white;color:white;flex-shrink:0;font-size:19px}.check.done{background:#8c76c5;border-color:#8c76c5}.itemmain{flex:1;min-width:0}.name{font-weight:750}.sub{font-size:12px;color:#9f9695;margin-top:4px}.iconbtn{border:none;background:transparent;color:#9d9290;padding:8px;font-size:17px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdfbf5;backdrop-filter:blur(9px);border-top:1px solid #eee6e2;display:flex;justify-content:space-around;padding:11px 8px max(14px,env(safe-area-inset-bottom))}.nav button{border:none;background:transparent;color:#a39998;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700}.nav button.active{color:#8068c2}.nav span{font-size:21px}.empty{background:white;padding:30px 16px;border-radius:16px;text-align:center;color:#998e8c}.modalbg{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal{background:#fffdfb;border-radius:22px 22px 0 0;max-width:560px;width:100%;padding:24px 18px max(26px,env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}label{display:block;font-size:13px;color:#746864;font-weight:700;margin:16px 0 7px}input[type=text],input[type=password],select{width:100%;padding:14px;border:1px solid #e6dbd7;border-radius:12px;background:white;color:#302929}.days{display:flex;gap:5px}.days button{flex:1;border:1px solid #ddd1d2;background:white;border-radius:10px;padding:10px 0;color:#817575}.days button.selected{background:#8871c4;color:white;border-color:#8871c4}.actions{display:flex;gap:8px;margin-top:22px}.actions button{flex:1;padding:14px;border:none;border-radius:12px;font-weight:750}.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:white;border-radius:16px;padding:20px}.stat strong{font-size:28px;display:block;margin-top:8px}.stat small{color:#948986}.note{font-size:12px;color:#9b8d8b}.danger{color:#b45151!important}.hidden{display:none}.daystrip{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px}.daystrip button{min-width:53px;border:0;border-radius:14px;padding:11px 4px;background:white;color:#817875}.daystrip button.active{background:#8871c4;color:white}.daystrip small{display:block;font-size:10px;margin-bottom:6px}

.calendarHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}.calendarGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calday{border:0;background:#fff;border-radius:12px;min-height:58px;color:#514947;padding:5px 2px}.calday.selected{outline:2px solid #8670cc;background:#f0eafb}.calday.future{opacity:.65}.calday .dot{display:block;width:7px;height:7px;border-radius:50%;background:#d5ced0;margin:6px auto 0}.calday .dot.full{background:#6cba9b}.calday .dot.part{background:#a48bd6}.calday .dot.none{background:#e3d4d8}.weeklabel{text-align:center;font-size:12px;color:#938c8a;padding:8px 0}.handle{touch-action:none;user-select:none;cursor:grab;border:0;background:transparent;font-size:20px;color:#a99f9b;padding:8px 3px}.item.dragging{opacity:.45}.item.drop-target{outline:2px dashed #9479cf}.reorder{display:flex;flex-direction:column;gap:3px}.reorder button{padding:3px 5px;font-size:12px;border:0;background:#f6f2f4;border-radius:6px}.rulehelp{font-size:12px;color:#8e8280;margin-top:7px}.inputnum{width:100%;padding:13px;border:1px solid #e6dbd7;border-radius:12px}.stack{display:flex;flex-wrap:wrap;gap:7px}.tag{display:inline-block;border-radius:15px;background:#ede6f7;color:#6954a6;font-size:12px;padding:5px 10px}.mini{border-radius:14px;padding:12px;background:#f7f2fa}.calTitle{font-weight:700}.bigbtn{padding:14px;border:0;border-radius:12px;background:#8871c4;color:white;font-weight:700}.badgeDot{border-radius:8px;background:#efebf9;padding:3px 7px;font-size:12px;color:#8068b9}.hint{font-size:12px;color:#857873;line-height:1.6}
</style></head><body><div class="app"><div id="app"></div></div><div class="nav"><button data-tab="today" class="active"><span>☑</span>오늘</button><button data-tab="all"><span>☷</span>전체 루틴</button><button data-tab="calendar"><span>▦</span>달력</button><button data-tab="stats"><span>▥</span>통계</button><button data-tab="settings"><span>⚙</span>설정</button></div><div id="portal"></div><script>
'use strict';
const KEY='personal-routine-v1',DOW=['일','월','화','수','목','금','토'],PERIODS=['아침','오후','저녁','언제든'];
let state={habits:[],checks:{},prefs:{localReminders:true}};
try{const obj=JSON.parse(localStorage.getItem(KEY));if(obj&&Array.isArray(obj.habits)&&obj.checks&&typeof obj.checks==='object'){state={...state,...obj};}}catch(e){}
let tab='today',day=localDate(),month=day.slice(0,7),editId=null,chosenDays=[0,1,2,3,4,5,6],dragId=null,dragFrom=null;
function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDate(x){const [y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(x,n){let d=parseDate(x);d.setDate(d.getDate()+n);return localDate(d)}
function diffDays(a,b){return Math.round((Date.UTC(...a.split('-').map((x,i)=>i===1?Number(x)-1:Number(x)))-Date.UTC(...b.split('-').map((x,i)=>i===1?Number(x)-1:Number(x))))/86400000)}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));updateBadge()}catch(e){alert('저장 공간이 부족해 기록을 저장하지 못했습니다. JSON 백업 후 저장공간을 확인해 주세요.')}}
function uuid(){return (crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2))}
function rule(h){return h.rule||{type:'week',days:Array.isArray(h.days)?h.days:[0,1,2,3,4,5,6]}}
function due(h,d){if(h.created&&d<h.created)return false;if(h.end&&d>h.end)return false;const r=rule(h),dow=parseDate(d).getDay();if(r.type==='daily')return true;if(r.type==='week')return (r.days||h.days||[]).includes(dow);if(r.type==='interval')return diffDays(d,r.anchor||h.created||d)>=0&&diffDays(d,r.anchor||h.created||d)%Math.max(1,+r.every||1)===0;if(r.type==='monthly'){const dt=parseDate(d);return dt.getDate()===(r.last?new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate():Math.min(+r.date||1,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()))}return false}
function checked(id,d){return !!state.checks[d]?.[id]}
function sorted(){return state.habits.slice().sort((a,b)=>(a.order??99999)-(b.order??99999))}
function timeOptions(){return Array.from({length:144},(_,i)=>{const h=Math.floor(i/6),m=(i%6)*10,v=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;return {value:v,label:`${h<12?'오전':'오후'} ${String(h%12||12).padStart(2,'0')}:${String(m).padStart(2,'0')}`}})}
function displayTime(v){return timeOptions().find(x=>x.value===v)?.label||'시간 미설정'}
function list(d){return sorted().filter(h=>due(h,d))}
function rate(d){const a=list(d);return{count:a.length,done:a.filter(h=>checked(h.id,d)).length}}
function toggle(id,d){state.checks[d]??={};if(state.checks[d][id])delete state.checks[d][id];else state.checks[d][id]=true;save();render()}
function ruleText(h){const r=rule(h);if(r.type==='daily')return '매일';if(r.type==='week')return (r.days||[]).length===7?'매일':(r.days||[]).map(x=>DOW[x]).join('·')+'요일';if(r.type==='interval')return `${r.every||1}일마다`;if(r.type==='monthly')return r.last?'매월 말일':`매월 ${r.date||1}일`;return '설정 없음'}
function streak(h){const today=localDate();let d=today,count=0,first=true,guard=0;while(guard++<3650){if(h.created&&d<h.created)break;if(due(h,d)){if(!checked(h.id,d)){if(first){d=addDays(d,-1);first=false;continue}break}count++;first=false}d=addDays(d,-1)}return count}
function item(h,d,withCheck=true,ordered=false){return `<div class="item" data-row="${esc(h.id)}">${ordered?`<button type="button" class="handle" data-drag="${esc(h.id)}" aria-label="순서 드래그">⠿</button>`:''}${withCheck?`<button class="check ${checked(h.id,d)?'done':''}" data-check="${esc(h.id)}" aria-label="완료">${checked(h.id,d)?'✓':''}</button>`:`<span style="font-size:23px">${esc(h.emoji||'🌱')}</span>`}<div class="itemmain"><div class="name">${withCheck?esc(h.emoji||'🌱')+' ':''}${esc(h.name)}</div><div class="sub">${h.time?'🕒 '+esc(displayTime(h.time))+' · ':''}${esc(h.period||'언제든')} · ${esc(ruleText(h))} · 🔥${streak(h)}일</div></div>${ordered?`<div class="reorder"><button data-move="${esc(h.id)}" data-dir="-1" aria-label="위로">▲</button><button data-move="${esc(h.id)}" data-dir="1" aria-label="아래로">▼</button></div>`:''}<button class="iconbtn" data-edit="${esc(h.id)}" aria-label="수정">✎</button></div>`}
function calendar(){const [y,m]=month.split('-').map(Number),n=new Date(y,m,0).getDate(),start=new Date(y,m-1,1).getDay();let cells=DOW.map(w=>`<div class="weeklabel">${w}</div>`).join('');for(let i=0;i<start;i++)cells+='<div></div>';for(let i=1;i<=n;i++){const d=`${month}-${String(i).padStart(2,'0')}`,r=rate(d),cls=!r.count?'':r.done===r.count?'full':r.done?'part':'none';cells+=`<button data-day="${d}" class="calday ${d===day?'selected':''} ${d>localDate()?'future':''}">${i}<span class="dot ${cls}"></span></button>`}return `<div class="calendarHead"><button class="softbtn" data-month="-1">‹</button><span class="calTitle">${y}년 ${m}월</span><button class="softbtn" data-month="1">›</button></div><div class="calendarGrid">${cells}</div><p class="hint">● 초록: 모두 완료 · 보라: 일부 완료 · 연분홍: 미완료</p>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const a=document.getElementById('app');if(tab==='today'){const r=rate(day),dates=Array.from({length:7},(_,i)=>addDays(day,i-3));a.innerHTML=`<div class="top"><div class="eyebrow">MY DAILY ROUTINE</div><div class="pill">🌷 나만의 페이스</div></div><h1>${day===localDate()?'오늘도 한 걸음 🌱':'나의 루틴 🌱'}</h1><div class="daystrip">${dates.map(d=>`<button data-day="${d}" class="${d===day?'active':''}"><small>${DOW[parseDate(d).getDay()]}</small>${parseDate(d).getDate()}</button>`).join('')}</div><div class="hero"><div>루틴 달성률 · ${day}</div><div class="val">${r.count?Math.round(r.done/r.count*100):0}%</div><div class="bar"><div style="width:${r.count?r.done/r.count*100:0}%"></div></div><p style="margin-bottom:0">${r.done} / ${r.count}개 완료</p></div><div class="section"><h2>오늘의 루틴</h2><button class="softbtn primary" data-new>＋ 추가</button></div>${list(day).length?list(day).map(h=>item(h,day,true,false)).join(''):'<div class="empty">등록된 루틴이 없어요.<br>＋ 추가로 시작해 보세요.</div>'}<p class="hint">순서 변경은 ‘전체 루틴’ 메뉴에서 할 수 있어요.</p>`}
else if(tab==='all'){a.innerHTML=`<div class="eyebrow">ALL ROUTINES</div><h1>전체 루틴</h1><div class="section"><span class="muted">총 ${state.habits.length}개 · 무제한</span><button class="softbtn primary" data-new>＋ 추가</button></div><p class="hint">⠿를 누른 채 위아래로 끌어 정렬하세요. ▲▼로도 변경 가능해요.</p>${sorted().length?sorted().map(h=>item(h,day,false,true)).join(''):'<div class="empty">루틴을 추가해 보세요.</div>'}`}
else if(tab==='calendar'){const r=rate(day);a.innerHTML=`<div class="eyebrow">MONTHLY CALENDAR</div><h1>월간 달력</h1>${calendar()}<div class="section"><h2>${day} <span class="badgeDot">${r.done}/${r.count}</span></h2><button class="softbtn" data-today>오늘</button></div>${list(day).length?list(day).map(h=>item(h,day)).join(''):'<div class="empty">이날 예정된 루틴이 없어요.</div>'}`}
else if(tab==='stats'){const dates=Array.from({length:30},(_,i)=>addDays(localDate(),-i)),total=dates.reduce((s,d)=>s+rate(d).count,0),done=dates.reduce((s,d)=>s+rate(d).done,0),perfect=dates.filter(d=>rate(d).count>0&&rate(d).done===rate(d).count).length;a.innerHTML=`<div class="eyebrow">MY PROGRESS</div><h1>통계</h1><p class="muted">오늘 포함 최근 30일</p><div class="statsgrid"><div class="stat"><small>전체 달성률</small><strong>${total?Math.round(done/total*100):0}%</strong></div><div class="stat"><small>완벽한 날</small><strong>${perfect}일</strong></div><div class="stat"><small>완료 횟수</small><strong>${done}회</strong></div><div class="stat"><small>등록 루틴</small><strong>${state.habits.length}개</strong></div></div><div class="section"><h2>루틴별 연속 달성</h2></div>${sorted().map(h=>`<div class="item"><span>${esc(h.emoji||'🌱')}</span><div class="itemmain"><div class="name">${esc(h.name)}</div><div class="sub">${esc(ruleText(h))}</div></div><strong>🔥 ${streak(h)}일</strong></div>`).join('')||'<div class="empty">루틴 기록이 없어요.</div>'}<div class="section"><h2>최근 7일</h2></div>${dates.slice(0,7).map(d=>{let r=rate(d);return `<div class="item" style="display:block"><div class="top"><span>${d}</span><span>${r.done}/${r.count}</span></div><div class="bar" style="margin-top:10px"><div style="width:${r.count?r.done/r.count*100:0}%"></div></div></div>`}).join('')}<p class="hint">연속 달성일은 해당 루틴의 예정일만 세며, 오늘 미체크는 아직 실패로 간주하지 않습니다. 월 1회 루틴은 연속된 예정 달이 ‘일’로 표시됩니다.</p>`}
else{const r=rate(localDate());a.innerHTML=`<div class="eyebrow">PREFERENCES</div><h1>설정 및 백업</h1><div class="item" style="display:block"><h2>홈 화면 요약 (위젯형)</h2><div class="mini" style="margin-top:12px"><strong>🌱 오늘 ${r.done}/${r.count}개 완료</strong><div class="bar" style="margin-top:10px"><div style="width:${r.count?r.done/r.count*100:0}%"></div></div></div><p class="hint">앱 내부 요약 카드입니다. iOS 바탕화면에 별도의 네이티브 위젯을 추가하는 기능은 PWA로 제공할 수 없습니다.</p></div><div class="item" style="display:block"><h2>🔔 서버 없는 시간 알림</h2><p class="hint">루틴별 시간에 앱이 화면에 열려 있으면 자동으로 안내합니다. 아이폰에서 앱이 닫히거나 백그라운드로 전환되면 정시 알림은 보장되지 않으며, 다시 앱을 열면 놓친 루틴을 안내합니다. iOS 웹앱은 서버 없이 종료 상태에서 예약 알림을 보낼 수 없습니다.</p><label style="font-weight:500"><input type="checkbox" id="local-reminders" ${state.prefs?.localReminders!==false?'checked':''}> 앱 실행 중 루틴 알림 켜기</label><div class="actions"><button class="softbtn" data-test-reminder>안내 미리보기</button><button class="softbtn" data-dismiss-overdue>오늘의 놓친 알림 확인 처리</button></div><p class="hint">오전·오후 시각은 각 루틴을 수정해서 10분 단위로 설정하세요. 시간대: 기기 현지 시간.</p></div><div class="item" style="display:block"><h2>내 데이터 보호하기</h2><p class="muted">기록은 이 기기에만 보관돼요. 업데이트 전 JSON 백업을 추천합니다.</p><div class="actions"><button class="primary" data-export>JSON 백업</button><button class="softbtn" data-import>백업 복원</button></div><input id="file" type="file" accept="application/json,.json" class="hidden"></div><div class="item" style="display:block"><h2>설치와 업데이트</h2><p class="hint">Safari에서 공유 → 홈 화면에 추가. 새 버전을 GitHub Pages에 업로드하면 다음 온라인 실행에서 갱신됩니다.</p></div><div class="item" style="display:block"><button class="softbtn danger" data-reset>전체 데이터 삭제</button></div>`}}
function showRule(){const t=document.getElementById('rtype')?.value;document.querySelectorAll('[data-rule-field]').forEach(x=>x.classList.toggle('hidden',x.dataset.ruleField!==t));}
function modal(h){editId=h?.id||null;const r=h?rule(h):{type:'daily'};chosenDays=r.type==='week'?[...(r.days||[])]:[0,1,2,3,4,5,6];document.getElementById('portal').innerHTML=`<div class="modalbg"><div class="modal" role="dialog" aria-modal="true" aria-label="루틴 편집"><div class="top"><h2>${h?'루틴 수정':'새 루틴 추가'}</h2><button class="iconbtn" data-close>✕</button></div><form id="habitForm"><label for="nm">루틴 이름</label><input id="nm" type="text" maxlength="70" required placeholder="예: 아침 스트레칭" value="${esc(h?.name||'')}"><label for="emoji">아이콘</label><input id="emoji" type="text" maxlength="8" value="${esc(h?.emoji||'🌱')}"><label for="period">시간대</label><select id="period">${PERIODS.map(v=>`<option ${h?.period===v?'selected':''}>${v}</option>`).join('')}</select><label for="htime">루틴 시작 시간 (10분 단위)</label><select id="htime"><option value="">시간 지정 안 함</option>${timeOptions().map(t=>`<option value="${t.value}" ${h?.time===t.value?'selected':''}>${t.label}</option>`).join('')}</select><label style="font-weight:500"><input type="checkbox" id="hremind" ${h?.remind?'checked':''}> 이 시간에 앱 실행 중 알림 받기</label><label for="rtype">반복 규칙</label><select id="rtype"><option value="daily" ${r.type==='daily'?'selected':''}>매일</option><option value="week" ${r.type==='week'?'selected':''}>특정 요일</option><option value="interval" ${r.type==='interval'?'selected':''}>N일마다</option><option value="monthly" ${r.type==='monthly'?'selected':''}>매월 특정일</option></select><div data-rule-field="week" class="hidden"><label>반복 요일</label><div class="days">${DOW.map((x,i)=>`<button type="button" data-week="${i}" class="${chosenDays.includes(i)?'selected':''}">${x}</button>`).join('')}</div></div><div data-rule-field="interval" class="hidden"><label for="every">몇 일마다?</label><input class="inputnum" id="every" type="number" min="1" max="365" value="${r.every||2}"><p class="rulehelp">루틴의 시작일을 기준으로 간격을 계산합니다.</p></div><div data-rule-field="monthly" class="hidden"><label for="mdate">매월 몇 일?</label><input class="inputnum" id="mdate" type="number" min="1" max="31" value="${r.date||1}"><label style="font-weight:500"><input type="checkbox" id="lastday" ${r.last?'checked':''}> 매월 말일 (위 날짜보다 우선)</label><p class="rulehelp">31일이 없는 달에는 해당 달의 마지막 날로 조정합니다.</p></div><div class="actions"><button class="softbtn" type="button" data-close>취소</button><button class="primary" type="submit">저장하기</button></div>${h?'<button type="button" class="softbtn danger" style="width:100%;margin-top:10px" data-delete>루틴 삭제</button>':''}</form></div></div>`;showRule();document.getElementById('nm').focus()}
function close(){document.getElementById('portal').innerHTML=''}
function reorder(id,target){const all=sorted(),from=all.findIndex(x=>x.id===id),to=all.findIndex(x=>x.id===target);if(from<0||to<0||from===to)return;const [h]=all.splice(from,1);all.splice(to,0,h);all.forEach((x,i)=>x.order=i);save();render()}
function move(id,dir){const all=sorted(),i=all.findIndex(h=>h.id===id),j=i+dir;if(i<0||j<0||j>=all.length)return;reorder(id,all[j].id)}
function updateBadge(){const r=rate(localDate()),remaining=r.count-r.done;if('setAppBadge'in navigator)navigator.setAppBadge(remaining).catch(()=>{});}

// Foreground-only reminders. No push subscription, remote server, or background scheduler.
const REMINDER_SEEN_KEY='personal-routine-local-reminder-v4';
let reminderSeen={};try{reminderSeen=JSON.parse(localStorage.getItem(REMINDER_SEEN_KEY))||{}}catch(_){reminderSeen={}}
function minutesOf(s){if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(s||''))return null;const [h,m]=s.split(':').map(Number);return h*60+m}
function storeReminderSeen(){try{localStorage.setItem(REMINDER_SEEN_KEY,JSON.stringify(reminderSeen))}catch(_){}}
function showReminderBanner(lines,overdue){
 let el=document.getElementById('routine-reminder-banner');if(!el){el=document.createElement('div');el.id='routine-reminder-banner';el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.style.cssText='position:fixed;z-index:200;left:12px;right:12px;top:12px;max-width:520px;margin:0 auto;background:#fff;border:2px solid #c6b6ef;border-radius:16px;padding:15px;box-shadow:0 6px 24px #33224b33;color:#322c2b';document.body.appendChild(el)}
 const title=document.createElement('strong');title.textContent=overdue?'⏰ 확인하지 못한 루틴':'🔔 루틴 시간 알림';el.replaceChildren(title);
 for(const line of lines){let p=document.createElement('p');p.style.margin='7px 0';p.textContent=line;el.appendChild(p)}
 const dismiss=document.createElement('button');dismiss.textContent='확인';dismiss.className='softbtn';dismiss.addEventListener('click',()=>el.remove());el.appendChild(dismiss);
}
function markOverdueSeen(){const d=localDate(),now=new Date(),mins=now.getHours()*60+now.getMinutes();for(const h of state.habits){const t=minutesOf(h.time);if(h.remind&&t!==null&&t<=mins&&due(h,d))reminderSeen[d+'|'+h.id]=true}storeReminderSeen()}
function checkLocalReminders(onResume=false){if(document.visibilityState!=='visible'||state.prefs?.localReminders===false)return;
 const now=new Date(),d=localDate(now),mins=now.getHours()*60+now.getMinutes();const dueNow=[],overdue=[];
 for(const h of state.habits){let t=minutesOf(h.time);if(!h.remind||t===null||!due(h,d)||checked(h.id,d))continue;
 const key=d+'|'+h.id;if(reminderSeen[key]||t>mins)continue;
 // On foreground, a reminder within its 10 minute time slot is considered timely; older ones are missed.
 if(mins-t<10&&!onResume)dueNow.push(h);else overdue.push(h);
 reminderSeen[key]=true;
 }
 if(dueNow.length||overdue.length){storeReminderSeen();showReminderBanner([...dueNow.map(h=>`${displayTime(h.time)} · ${h.name}`),...overdue.map(h=>`미완료: ${displayTime(h.time)} · ${h.name}`)],overdue.length>0&&!dueNow.length)}
 // Keep last 45 dates to avoid unlimited reminder metadata growth.
 const oldest=addDays(d,-45);let changed=false;for(const k of Object.keys(reminderSeen)){if(k.slice(0,10)<oldest){delete reminderSeen[k];changed=true}}if(changed)storeReminderSeen();
}
document.addEventListener('change',e=>{if(e.target.id==='local-reminders'){state.prefs??={};state.prefs.localReminders=e.target.checked;save();if(e.target.checked)checkLocalReminders(true)}});
window.addEventListener('focus',()=>checkLocalReminders(true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkLocalReminders(true)});
setInterval(()=>checkLocalReminders(false),15000);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.hasAttribute('data-new'))modal();else if(b.dataset.day){day=b.dataset.day;month=day.slice(0,7);render()}else if(b.hasAttribute('data-today')){day=localDate();month=day.slice(0,7);render()}else if(b.dataset.month){const [y,m]=month.split('-').map(Number);const d=new Date(y,m-1+Number(b.dataset.month),1);month=localDate(d).slice(0,7);render()}else if(b.dataset.check)toggle(b.dataset.check,day);else if(b.dataset.edit)modal(state.habits.find(h=>h.id===b.dataset.edit));else if(b.dataset.move)move(b.dataset.move,+b.dataset.dir);else if(b.hasAttribute('data-close'))close();else if(b.dataset.week!==undefined){const i=+b.dataset.week;chosenDays=chosenDays.includes(i)?chosenDays.filter(x=>x!==i):[...chosenDays,i];document.querySelectorAll('[data-week]').forEach(el=>el.classList.toggle('selected',chosenDays.includes(+el.dataset.week)))}else if(b.hasAttribute('data-delete')){if(confirm('루틴을 삭제할까요? 기존 완료 기록도 삭제됩니다.')){state.habits=state.habits.filter(h=>h.id!==editId);Object.values(state.checks).forEach(x=>delete x[editId]);save();close();render()}}else if(b.hasAttribute('data-export')){const blob=new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),...state,prefs:{...state.prefs,api:undefined,pushEnabled:undefined}},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-routine-backup-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}else if(b.hasAttribute('data-import'))document.getElementById('file').click();else if(b.hasAttribute('data-reset')){if(confirm('모든 루틴과 기록을 삭제할까요? 먼저 백업을 권장합니다.')){state={habits:[],checks:{},prefs:{localReminders:true}};save();render()}}else if(b.hasAttribute('data-test-reminder'))showReminderBanner(['🌱 알림 예시: 지금 루틴을 시작할 시간이에요.'],false);else if(b.hasAttribute('data-dismiss-overdue')){markOverdueSeen();showReminderBanner(['오늘의 놓친 루틴을 확인 처리했어요.'],false)}});
document.addEventListener('change',async e=>{if(e.target.id==='rtype'){showRule();return}if(e.target.id!=='file')return;const f=e.target.files[0];if(!f)return;try{if(f.size>5e6)throw Error('파일이 너무 큽니다');const data=JSON.parse(await f.text());if(!Array.isArray(data.habits)||!data.checks||Array.isArray(data.checks)||typeof data.checks!=='object'||data.habits.some(h=>!h.id||typeof h.name!=='string'||!Array.isArray(h.days)&&!h.rule))throw Error('잘못된 파일');if(confirm('기존 데이터를 백업 파일로 교체할까요?')){state={habits:data.habits.map((h,i)=>({...h,name:h.name.slice(0,70),emoji:String(h.emoji||'🌱').slice(0,8),period:PERIODS.includes(h.period)?h.period:'언제든',created:h.created||localDate(),order:h.order??i,days:Array.isArray(h.days)?h.days.filter(d=>Number.isInteger(d)&&d>=0&&d<7):[0,1,2,3,4,5,6]})),checks:data.checks,prefs:{...(data.prefs||{}),pushEnabled:false,api:undefined}};save();render();alert('복원 완료')}}catch(err){alert('올바른 JSON 백업 파일이 아니에요.')}e.target.value=''});
document.addEventListener('submit',e=>{if(e.target.id!=='habitForm')return;e.preventDefault();const name=document.getElementById('nm').value.trim(),type=document.getElementById('rtype').value;if(!name||type==='week'&&!chosenDays.length){alert('루틴 이름과 반복 요일을 확인하세요');return}const h=editId?state.habits.find(x=>x.id===editId):null;let r={type};if(type==='week')r.days=chosenDays.slice().sort();if(type==='interval'){r.every=+document.getElementById('every').value;if(!(r.every>=1&&r.every<=365)){alert('1~365일 사이 간격을 입력하세요');return}r.anchor=h?.rule?.anchor||h?.created||localDate()}if(type==='monthly'){r.date=+document.getElementById('mdate').value;r.last=document.getElementById('lastday').checked;if(!(r.date>=1&&r.date<=31)){alert('1~31일을 입력하세요');return}}const chosenTime=document.getElementById('htime').value;if(document.getElementById('hremind').checked&&!chosenTime){alert('알림을 받으려면 시간을 선택하세요');return}const patch={name,time:chosenTime,remind:document.getElementById('hremind').checked,emoji:document.getElementById('emoji').value.trim()||'🌱',period:document.getElementById('period').value,rule:r,days:type==='week'?r.days:type==='daily'?[0,1,2,3,4,5,6]:[]};if(h)Object.assign(h,patch);else state.habits.push({id:uuid(),...patch,created:localDate(),order:state.habits.length});save();close();render()});
// iOS Safari에는 일반 HTML drag/drop의 터치 호환성이 낮아 Pointer Events로 재정렬합니다.
document.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-drag]');if(!handle)return;dragId=handle.dataset.drag;dragFrom=handle.closest('[data-row]');handle.setPointerCapture?.(e.pointerId);dragFrom?.classList.add('dragging');e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!dragId)return;document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));let row=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-row]');if(row&&row!==dragFrom)row.classList.add('drop-target')});
document.addEventListener('pointerup',e=>{if(!dragId)return;const id=dragId,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-row]')?.dataset.row;dragId=null;dragFrom=null;document.querySelectorAll('.drop-target,.dragging').forEach(x=>x.classList.remove('drop-target','dragging'));if(target&&target!==id)reorder(id,target)});
document.addEventListener('pointercancel',()=>{dragId=null;dragFrom=null;document.querySelectorAll('.drop-target,.dragging').forEach(x=>x.classList.remove('drop-target','dragging'))});
const initialTab=new URLSearchParams(location.search).get('tab');if(['today','all','calendar','stats','settings'].includes(initialTab))tab=initialTab;state.habits.forEach((h,i)=>{if(h.order==null)h.order=i});render();updateBadge();setTimeout(()=>checkLocalReminders(true),400);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
